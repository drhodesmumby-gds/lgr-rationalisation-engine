<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} — LGR Rationalisation Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism.min.css">
    <style>
        :root { --govuk-black: #0b0c0c; --govuk-blue: #1d70b8; --govuk-light-grey: #f3f2f1; --govuk-red: #d4351c; --govuk-green: #00703c; --govuk-purple: #53284f; --govuk-orange: #f47738; }
        body { font-family: "Arial", sans-serif; color: var(--govuk-black); }
        a { color: var(--govuk-blue); }
        a:hover { color: #003078; }
        .doc-content h1 { font-size: 2rem; font-weight: bold; margin-bottom: 1.5rem; border-bottom: 4px solid var(--govuk-blue); padding-bottom: 0.75rem; }
        .doc-content h2 { font-size: 1.5rem; font-weight: bold; margin-top: 2.5rem; margin-bottom: 1rem; border-bottom: 1px solid #b1b4b6; padding-bottom: 0.5rem; }
        .doc-content h3 { font-size: 1.2rem; font-weight: bold; margin-top: 2rem; margin-bottom: 0.75rem; }
        .doc-content h4 { font-size: 1rem; font-weight: bold; margin-top: 1.5rem; margin-bottom: 0.5rem; }
        .doc-content p { margin-bottom: 1rem; line-height: 1.7; }
        .doc-content ul, .doc-content ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .doc-content li { margin-bottom: 0.4rem; line-height: 1.6; }
        .doc-content ul { list-style-type: disc; }
        .doc-content ol { list-style-type: decimal; }
        .doc-content code { background-color: var(--govuk-light-grey); padding: 2px 6px; font-size: 0.9em; font-family: monospace; }
        .doc-content pre { background-color: #f8f8f8; border: 1px solid #b1b4b6; border-left: 4px solid var(--govuk-blue); padding: 1.25rem; overflow-x: auto; margin-bottom: 1.5rem; font-size: 14px; line-height: 1.6; border-radius: 0; }
        .doc-content pre code { background: none; padding: 0; font-size: inherit; font-family: 'Menlo', 'Consolas', 'Monaco', monospace; }
        .doc-content table { width: 100%; border-collapse: collapse; margin-bottom: 1.5rem; }
        .doc-content th { background-color: var(--govuk-light-grey); font-weight: bold; text-align: left; padding: 12px; border-bottom: 2px solid var(--govuk-black); }
        .doc-content td { padding: 12px; border-bottom: 1px solid #b1b4b6; vertical-align: top; }
        .doc-content blockquote { border-left: 4px solid var(--govuk-blue); padding-left: 1rem; margin-left: 0; margin-bottom: 1rem; color: #505a5f; font-style: italic; }
        .doc-content img { max-width: 100%; height: auto; margin: 1rem 0; border: 1px solid #b1b4b6; }
        .doc-content .callout { padding: 1rem; margin-bottom: 1.5rem; border-left: 4px solid; }
        .doc-content .callout-info { background: #e8f0fe; border-color: var(--govuk-blue); }
        .doc-content .callout-warning { background: #fef3e8; border-color: var(--govuk-orange); }
        .doc-content .callout-success { background: #e6f4ea; border-color: var(--govuk-green); }
        .nav-link { display: block; padding: 6px 12px; font-size: 14px; text-decoration: none; color: #505a5f; border-left: 3px solid transparent; }
        .nav-link:hover { background: var(--govuk-light-grey); color: var(--govuk-black); }
        .nav-link.active { border-left-color: var(--govuk-blue); color: var(--govuk-black); font-weight: bold; background: var(--govuk-light-grey); }
        .nav-section { font-weight: bold; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; color: #505a5f; padding: 12px 12px 4px; margin-top: 12px; }
    </style>
</head>
<body class="bg-white">
    <!-- Header -->
    <header class="border-t-8 border-[#1d70b8] bg-[#0b0c0c] text-white">
        <div class="max-w-7xl mx-auto px-6 py-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <span class="font-bold text-lg">LGR Rationalisation Engine</span>
                <span class="text-sm text-gray-300">Documentation</span>
            </div>
            <a href="../lgr-rationalisation-engine.html" class="text-sm text-gray-300 hover:text-white underline">Open Application</a>
        </div>
    </header>

    <!-- Breadcrumb -->
    <nav class="max-w-7xl mx-auto px-6 py-2 text-sm" aria-label="Breadcrumb">
        {{BREADCRUMB}}
    </nav>

    <!-- Main layout -->
    <div class="max-w-7xl mx-auto px-6 flex gap-8">
        <!-- Sidebar -->
        <aside class="w-60 flex-shrink-0 hidden lg:block">
            <nav class="sticky top-4 py-4" aria-label="Documentation navigation">
                {{SIDEBAR}}
            </nav>
        </aside>

        <!-- Content -->
        <main class="flex-1 min-w-0 py-6 pb-16">
            <article class="doc-content max-w-[800px]">
                {{CONTENT}}
            </article>

            <!-- Prev/Next -->
            <nav class="flex justify-between mt-12 pt-6 border-t border-[#b1b4b6]" aria-label="Pagination">
                {{PAGINATION}}
            </nav>
        </main>
    </div>

    <!-- Footer -->
    <footer class="border-t border-[#b1b4b6] mt-16 bg-[#f3f2f1]">
        <div class="max-w-7xl mx-auto px-6 py-6 text-sm text-[#505a5f]">
            <p>LGR Rationalisation Engine documentation.</p>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';
        mermaid.initialize({ startOnLoad: true, theme: 'neutral', themeVariables: { primaryColor: '#1d70b8', primaryTextColor: '#0b0c0c', lineColor: '#505a5f' } });
    </script>
</body>
</html>
